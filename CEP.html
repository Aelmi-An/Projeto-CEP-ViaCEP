<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEP API</title>
    <link rel="stylesheet" href="CEP.css">
    <script src="CEP.js" defer></script>
</head>
<body>

    <h1>ViaCEP</h1>

    <section>
        <h2>Pesquisa por CEP</h2>
        <input type="text" id="CEPzin" placeholder="Digite o CEP (8 dígitos)">
        <button onclick="processarBusca()">Buscar Endereço</button>
    </section>

    <section>
        <h2>Pesquisa por Endereço</h2>
        <select id="UF">
            <option value="">Selecione a UF</option>
            <option value="AC">AC</option>
            <option value="AL">AL</option>
            <option value="AP">AP</option>
            <option value="AM">AM</option>
            <option value="BA">BA</option>
            <option value="CE">CE</option>
            <option value="DF">DF</option>
            <option value="ES">ES</option>
            <option value="GO">GO</option>
            <option value="MA">MA</option>
            <option value="MT">MT</option>
            <option value="MS">MS</option>
            <option value="MG">MG</option>
            <option value="PA">PA</option>
            <option value="PB">PB</option>
            <option value="PR">PR</option>
            <option value="PE">PE</option>
            <option value="PI">PI</option>
            <option value="RJ">RJ</option>
            <option value="RN">RN</option>
            <option value="RS">RS</option>
            <option value="RO">RO</option>
            <option value="RR">RR</option>
            <option value="SC">SC</option>
            <option value="SP">SP</option>
            <option value="SE">SE</option>
            <option value="TO">TO</option>
        </select>
        <input type="text" id="Cidade" placeholder="Cidade">
        <input type="text" id="Logradouro" placeholder="Logradouro">
        <button onclick="buscarPorEndereco()">Buscar CEP</button>
    </section>

    <div id="espaçoderesposta"></div>

    <button id="Limpar">Limpar</button>

    <section>
        <h2>Histórico</h2>
        <ul id="historico"></ul>
    </section>

</body>
</html>
